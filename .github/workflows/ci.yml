name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine (Spring Boot, Kafka + Neo4j integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B verify

  scorer:
    name: ML scorer (scikit-learn)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Train and print metrics
        run: python train.py

  simulator:
    name: Transaction simulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q

  dashboard:
    name: Dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end (docker compose)
    runs-on: ubuntu-latest
    needs: [engine, scorer, simulator, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the engine
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q UP; then echo "engine is up"; break; fi
            sleep 5
          done
          curl -fs http://localhost:8080/actuator/health
      - name: Let the simulator stream payments
        run: sleep 90
      - name: Check payments were scored and fraud was caught
        run: |
          stats=$(curl -fs http://localhost:8080/api/stats)
          echo "$stats"
          total=$(echo "$stats" | jq .total)
          alerts=$(echo "$stats" | jq '.review + .blocked')
          test "$total" -gt 500
          test "$alerts" -gt 0
          echo "Latest alerts:"
          curl -fs "http://localhost:8080/api/alerts?limit=5" | jq '.[] | {decision, riskScore, mlScore, rules: [.ruleHits[].rule]}'
      - name: Dashboard is served and proxies the API
        run: |
          curl -fs http://localhost:3000 | grep -q "Fraud Monitor"
          curl -fs http://localhost:3000/api/stats | jq .
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v
